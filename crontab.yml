---
- name: Playbook to configure cronjob
  hosts: all
  tasks:
    - name: TASK - creating user if does not exists
      ansible.builtin.user:
        name: student
        state: present
    - name: TASK - configuring cronjob
      ansible.builtin.cron:
        name: ex294_cron
        user: student
        job: logger "EX294 in progress"
        minute: "*/2"

