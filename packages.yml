---
- name: Playbook-1 to install packages
  hosts: dev,test,prod
  tasks:
    - name: Installing php-mariadb
      ansible.builtin.dnf:
        name: [php,mariadb]
        state: present

- name: Playbook-2 to install RPM Development Tools
  hosts: test
  tasks:
    - name: Installing RPM Development Tools
      ansible.builtin.dnf:
        name: "@RPM Development Tools"
        state: present

- name: Playbook-3 to upgrade packages
  hosts: prod
  tasks:
    - name: Installing php-mariadb
      ansible.builtin.dnf:
        name: "*"
        state: latest

