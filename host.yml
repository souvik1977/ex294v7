---
- name: Playbook to create /etc/myhosts on dev host servers
  hosts: all
  tasks:
    - name: TASK - Generating /etc/myhosts
      ansible.builtin.template:
        src: host.j2
        dest: /etc/myhosts
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname in groups['dev']
